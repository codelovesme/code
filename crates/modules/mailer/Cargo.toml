# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "mailer"
version = "1.8.4"
edition = "2021"
description = "The `mailer` native module for the Code programming language — send email over SMTP (any provider: Gmail, SES, Postmark, a relay of your own)."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "rustls-tls",
    "hostname",
] }
