# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "vacuole"
version = "2.31.1"
edition = "2021"
description = "The `vacuole` native module for the Code programming language — an in-process key→value store with a byte budget and least-recently-used eviction that tells the caller what it evicted."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
serde_json = { version = "1", features = ["preserve_order"] }
