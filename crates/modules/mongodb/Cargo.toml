# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "mongodb"
version = "1.7.2"
edition = "2021"
description = "The `mongodb` native module for the Code programming language — documents in and out of a MongoDB collection, plus a key/value layer."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

# `lib.name` is the module name (`libmongodb.so`, `link \"mongodb.so\"`); the
# driver is renamed so it doesn't collide with this crate's own name.
[lib]
name = "mongodb"
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
driver = { package = "mongodb", version = "3", features = ["sync"] }
