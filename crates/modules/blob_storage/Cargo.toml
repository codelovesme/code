# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "blob_storage"
version = "1.2.0"
edition = "2021"
description = "The `blob_storage` native module for the Code programming language — put, get, list and delete objects in S3-compatible storage (AWS, MinIO, R2, B2, Spaces)."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

[lib]
name = "blob_storage"
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
rust-s3 = { version = "0.35", default-features = false, features = ["sync", "sync-rustls-tls"] }
base64 = "0.22"
