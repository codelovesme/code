# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "azure_mailer"
version = "2.4.0"
edition = "2021"
description = "The `azure_mailer` native module for the Code programming language — send email through Azure Communication Services, with `mailer`'s Send surface."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
httpdate = "1"
