# Standalone workspace, like every first-party module (see json's Cargo.toml).
[workspace]

[package]
name = "csv"
version = "2.21.0"
edition = "2021"
description = "The `csv` native module for Code — Parse CSV text into rows and Stringify rows back, quoting as RFC 4180 does."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
csv-engine = { package = "csv", version = "1" }
