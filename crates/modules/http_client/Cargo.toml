# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree. Same convention
# `strings` and `math` use.
[workspace]

[package]
name = "http_client"
version = "2.10.0"
edition = "2021"
description = "The `http_client` native module for the Code programming language — Get, Post, Put, Patch, Delete, Head and Options over HTTP(S). Written in Rust on code-native."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]

# On a machine the module uses ureq and the native ABI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
code-native = { path = "../../code-native" }
ureq = "3"

# In a browser the page half is linked into the wasm host; it has no socket
# or standard-library dependency of its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
code-native = { path = "../../code-native", default-features = false, features = ["static-module"] }
