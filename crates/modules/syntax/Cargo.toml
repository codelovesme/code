# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "syntax"
version = "2.10.0"
edition = "2021"
description = "The `syntax` native module for the Code programming language — source text as coloured spans, classified by the language's own lexer. Written in Rust on code-native."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
# The lexer is all this module uses — no LLVM, no dlopen, no installer:
# the same slice `crates/code-wasm` takes.
code = { path = "../../..", default-features = false }
