# Standalone workspace, like every first-party module (see json's Cargo.toml).
[workspace]

[package]
name = "xml"
version = "2.18.0"
edition = "2021"
description = "The `xml` native module for Code — Parse XML (an RSS or Atom feed, an OpenAPI document) into the element shape the language uses for a tree."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
quick-xml = "0.37"
