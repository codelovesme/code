# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "blob_fs"
version = "2.31.1"
edition = "2021"
description = "The `blob_fs` native module for the Code programming language — blob_storage's handlers, kept as plain files on a disk."
license = "GPL-3.0"
repository = "https://github.com/codelovesme"

[lib]
name = "blob_fs"
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
base64 = "0.22"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
