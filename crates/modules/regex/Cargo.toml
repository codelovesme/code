# Standalone workspace, like every first-party module (see json's Cargo.toml).
[workspace]

[package]
name = "regex"
version = "2.21.1"
edition = "2021"
description = "The `regex` native module for Code — Match, Find, Replace and Split by pattern, on a linear-time engine."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
regex-engine = { package = "regex", version = "1" }
