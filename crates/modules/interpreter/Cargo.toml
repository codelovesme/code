# Standalone workspace, deliberately: first-party modules build on their own
# (their release CI checks out the repo and builds each module alone), and
# the empty `[workspace]` table stops `cargo` from walking up into the main
# repo's workspace when the module is built in-tree.
[workspace]

[package]
name = "interpreter"
version = "2.9.0"
edition = "2021"
description = "The `interpreter` native module for the Code programming language — source text loaded as a linked program of its own, talked to with particles, unloaded again. Written in Rust on code-native over the language's interpreter."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"

[lib]
crate-type = ["cdylib"]

[dependencies]
code-native = { path = "../../code-native" }
# The interpreter alone: no LLVM, no dlopen, no installer — the same slice
# `crates/code-wasm` takes. A program loaded here links nothing, so there
# is nothing for the module story to do.
code = { path = "../../..", default-features = false }
