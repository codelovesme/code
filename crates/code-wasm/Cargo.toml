[package]
name = "code-wasm"
version = "1.8.6"
edition = "2021"
description = "wasm32 bridge for the code language interpreter — powers the browser playground."
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
code = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
# For decode_json in lib.rs: a module's `vars()`/`dispatch()` return real
# JSON ("key": value), which diverged from this language's own object-literal
# grammar (name = value) once computed keys landed — see decode_json's doc
# comment.
serde_json = "1"
