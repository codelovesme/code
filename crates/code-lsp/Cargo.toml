[package]
name = "code-lsp"
version = "2.27.0"
edition = "2021"
description = "Language Server Protocol implementation for the Code programming language — static diagnostics, semantic tokens and formatting over the language engine."
license = "GPL-3.0"
repository = "https://github.com/codelovesme/code"
publish = false

[[bin]]
name = "code-lsp"
path = "src/main.rs"

[dependencies]
# Source analysis (parser, verifier and static diagnostics) — no LLVM backend,
# no native module loading or installer. Those all live behind default-off features (see the crate
# root's Cargo.toml), so disabling them here is just not asking for what an
# editor-integration process has no use for.
code = { path = "../..", default-features = false }
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt"] }

[dev-dependencies]
serde_json = "1"
