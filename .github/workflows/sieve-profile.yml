name: Measure guarded Bool part writes
on:
  workflow_dispatch:
  push:
    branches: [sieve-bool-writes-234]
    paths: ["src/codegen.rs", ".github/workflows/sieve-profile.yml", "benchmarks/sieve-profile/run.py"]
permissions:
  contents: read
concurrency:
  group: sieve-profile
  cancel-in-progress: false
env:
  LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the LLVM backend used by both compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev
      - name: Build the fixed source baseline and candidate identically
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/bool-before-source" e742d5ba4c59dc4b88c4a90351cb72d8ae31ca4f
          mkdir -p "$RUNNER_TEMP/bool-compilers"
          CARGO_TARGET_DIR="$RUNNER_TEMP/bool-build" cargo build --manifest-path "$RUNNER_TEMP/bool-before-source/Cargo.toml" --workspace --release
          cp "$RUNNER_TEMP/bool-build/release/code" "$RUNNER_TEMP/bool-compilers/before"
          CARGO_TARGET_DIR="$RUNNER_TEMP/bool-build" cargo build --workspace --release
          cp "$RUNNER_TEMP/bool-build/release/code" "$RUNNER_TEMP/bool-compilers/after"
      - name: Validate and sample all before/after entries serially
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 benchmarks/sieve-profile/run.py --before "$RUNNER_TEMP/bool-compilers/before" --after "$RUNNER_TEMP/bool-compilers/after" --output-dir "$RUNNER_TEMP/bool-results" --runs 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-bool-writes
          path: ${{ runner.temp }}/bool-results
          retention-days: 30
