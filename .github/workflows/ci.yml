name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # inkwell links LLVM 17 (codegen.rs). Compiled programs also link against
  # the embedded C runtime (runtime.c) via the system `cc`, which the
  # runner's default toolchain already provides.
  LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    # A MongoDB service for `tests/mongodb_module.rs`. MinIO (for
    # `tests/blob_storage_module.rs`) is started as a step below rather than
    # a service container: it needs a `server /data` command, which the
    # `services:` block can't supply, and Bitnami's self-starting image no
    # longer publishes a usable tag. Both tests skip themselves when their
    # env vars are unset, so a fork without either still passes.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: codetest
      S3_SECRET_KEY: codetest-secret
      S3_BUCKET: codetest
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO (S3 for tests/blob_storage_module.rs)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=codetest -e MINIO_ROOT_PASSWORD=codetest-secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting check
        run: cargo fmt --all --check

      # The same gate for the language's own source. `--check` writes nothing
      # and exits non-zero if any `.code` file is not canonically laid out;
      # the `fail_*` fixtures that are deliberate parse errors are reported
      # and skipped rather than failing it (see `cmd_format`).
      - name: Code formatting check
        run: cargo run --quiet -- format --check tests/

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

  wasm-playground:
    name: code-wasm builds for wasm32 (playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Assert code-wasm pulls in no LLVM (must stay interpreter-only)
        run: |
          if cargo tree -p code-wasm -e normal | grep -Ei 'inkwell|llvm-sys'; then
            echo "::error::code-wasm pulled in LLVM (inkwell/llvm-sys); it must depend on the root crate with default-features = false"
            exit 1
          fi

      - name: Build code-wasm for wasm32-unknown-unknown
        run: cargo build -p code-wasm --release --target wasm32-unknown-unknown
