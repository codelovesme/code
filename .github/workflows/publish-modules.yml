name: Publish modules

on:
  # One version for everything this repo publishes (2026-08-29, reversing the
  # per-module cadence this used to have): a `v*` tag releases the CLI *and*
  # every module at the same number, so a user holding `code v1.1.0` and
  # `console 1.1.0` never has to ask whether the two match.
  push:
    tags: ["v*"]
  # Manual dry-run: builds every platform artifact and uploads them as
  # Actions artifacts, but creates no GitHub Release (guarded below), so
  # the pipeline can be exercised without cutting a tag.
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA}"
          fi
          # The tag and the source must agree. `tests/one_version.rs` already
          # holds every manifest to the repository's version; this holds the
          # tag to it too, so the three cannot drift apart silently.
          repo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [[ "${{ github.ref_type }}" == "tag" && "$version" != "$repo_version" ]]; then
            echo "::error::tag says $version but Cargo.toml says $repo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Every build job compiles the same way — one self-contained crate, no
  # external dependencies — so the only differences are the runner, the
  # compiler invocation, and the artifact extension (.so vs .dylib).
  # Every first-party module is Rust on `code-native` since 2026-08-28
  # (`cargo build` inside its standalone workspace — see those crates'
  # Cargo.toml for why they opt out of the main one). `console` was the last
  # C one; it moved because a module may not end the application and that
  # promise is only keepable in Rust. Asset names follow the distribution
  # doc: <module>-<platform><ext>.
  build-linux-x86_64:
    name: Build ${{ matrix.module }} (linux-x86_64)
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # Every module, every release. Keep this list in step with
      # crates/modules/ — the dogfood step below fails loudly on a module it
      # has no demo for, which is what catches an addition here that was made
      # without one.
      matrix:
        module: [console, strings, math, env, http_client, http_server, json, crypto, jwt, markdown, fs, json_store, process, git, mailer, oauth, mongodb, blob_storage, cloud_drive, localai, blob_storage_mock, cloud_drive_mock, git_mock, localai_mock, mailer_mock, mongodb_mock, net_client, net_server, membrane, dom, guest, router, storage, timer, oauth_mock]
    steps:
      - uses: actions/checkout@v4
      # Each module is its own workspace with its own Cargo.lock (see those
      # crates' Cargo.toml for why they opt out of the main one), so the cache
      # is pointed at that workspace rather than the repository root. It holds
      # the dependency tree, not the module's own crate — which is where the
      # time actually goes: `jwt` drags in ring and rustls, `blob_storage` an
      # HTTP stack, and both spent over a minute rebuilding them on every tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/modules/${{ matrix.module }}
      - name: Compile
        run: |
          set -euo pipefail
          m="${{ matrix.module }}"
          mkdir -p dist
          (cd "crates/modules/$m" && cargo build --release)
          mv "crates/modules/$m/target/release/lib$m.so" "dist/${m}-linux-x86_64.so"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.module }}-linux-x86_64
          path: "dist/*.so"

  # The browser's half. A module a web application links has to arrive as a
  # `.a`, not a `.so`: a page has no dlopen, so what it needs is linked *into*
  # the module rather than opened beside it.
  #
  # A short list on purpose. Most modules reach for a socket, a file or a
  # clock and do not compile for `wasm32-unknown-unknown` at all; the two
  # here are the two a page can use, and a third joins them by being added
  # to this list and building.
  build-wasm32:
    name: Build ${{ matrix.module }} (wasm32)
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [console, dom, guest, net_client, router, storage, timer]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/modules/${{ matrix.module }}
      - name: Add the target
        run: rustup target add wasm32-unknown-unknown
      - name: Compile
        run: |
          set -euo pipefail
          m="${{ matrix.module }}"
          mkdir -p dist
          # A cdylib is a whole module and fails to link on the very imports
          # an archive is supposed to leave open, so the crate type is asked
          # for here rather than in Cargo.toml.
          (cd "crates/modules/$m" \
            && cargo rustc --target wasm32-unknown-unknown --release --crate-type staticlib)
          mv "crates/modules/$m/target/wasm32-unknown-unknown/release/lib$m.a" \
             "dist/${m}-wasm32.a"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.module }}-wasm32
          path: "dist/*.a"

  # The `code` binary every dogfood job below needs — built once here rather
  # than 27 times over there. That is what it used to be: each of the 27
  # matrix jobs installed LLVM 17 from apt and compiled the whole compiler,
  # to then spend about a second linking one module and emitting one
  # particle. Same artifact, 27 times, ~40 runner-minutes of it.
  #
  # It travels as an artifact because it can: the release binary links LLVM
  # statically (`ldd` on it names ten shared objects and none of them is
  # LLVM), which is the same reason release.yml's tarball runs on machines
  # that never installed LLVM at all.
  build-code:
    name: Build code (once, for every dogfood job)
    needs: resolve
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build code
        run: cargo build --release --bin code
      - uses: actions/upload-artifact@v4
        with:
          name: code-binary
          path: target/release/code
          if-no-files-found: error

  # Proof the artifact actually loads: take the real `code` binary and run
  # a script that links the just-built .so through BOTH output modes — the
  # same parity invariant the fixture harness enforces, applied to the
  # shipped artifact rather than the test-tree build.
  dogfood:
    name: Dogfood ${{ matrix.module }} (code run + code build)
    needs: [resolve, build-code, build-linux-x86_64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [console, strings, math, env, http_client, http_server, json, crypto, jwt, markdown, fs, json_store, process, git, mailer, oauth, mongodb, blob_storage, cloud_drive, localai, blob_storage_mock, cloud_drive_mock, git_mock, localai_mock, mailer_mock, mongodb_mock, net_client, net_server, membrane, dom, guest, router, storage, timer, oauth_mock]
    steps:
      - uses: actions/checkout@v4

      # No toolchain and no LLVM on this runner: nothing here compiles Rust.
      # `code build` does still shell out to a system `cc` for the final
      # link, which ubuntu-latest ships — that is the one build dependency
      # this job has left, and it is why removing the toolchain is safe.
      - name: Download the code binary
        uses: actions/download-artifact@v4
        with:
          name: code-binary
          path: target/release
      - name: Make it runnable and prove it runs
        run: |
          set -euo pipefail
          # download-artifact does not preserve the executable bit.
          chmod 0755 target/release/code
          ./target/release/code --version

      - name: Download linux-x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: module-${{ matrix.module }}-linux-x86_64
          path: dogfood
      - name: Run through both output modes
        run: |
          set -euo pipefail
          m="${{ matrix.module }}"
          # One small dispatch per module — proof the artifact loads and
          # routes a particle, in both output modes. `Print` writes to
          # stdout and reports 13; `Echo` hands its operand back unchanged,
          # so asserting on the echoed value proves the round trip.
          cat > dogfood/demo.code <<EOF
          link "${m}.so" as mod
          EOF
          case "$m" in
            console)
              printf 'emit Print { value = "phase B works" } to mod get r\nassert r.value = 13\n' >> dogfood/demo.code
              ;;
            strings)
              printf 'emit Echo { value = 13 } to mod get r\nassert r.value = 13\n' >> dogfood/demo.code
              ;;
            math)
              printf 'emit Double { value = 21 } to mod get r\nassert r.value = 42\n' >> dogfood/demo.code
              ;;
            env)
              # PATH is set on every runner, and reading it needs nothing
              # arranged — proof the artifact loads and routes.
              printf 'emit Get { name = "PATH" } to mod get r\nassert r.found\n' >> dogfood/demo.code
              ;;
            http_server)
              # Config, Listen, then Stop — binds an OS-chosen port on
              # loopback and never serves anything: the artifact loads, routes
              # the particles, and reports the port it got.
              #
              # `Stop` is not decoration. Since the host keeps a program alive
              # while a module reports itself serving, a demo that ends after
              # `Listen` no longer ends at all — it hangs until the job times
              # out six hours later, which is exactly what v1.2.0 and v1.2.1
              # did, taking the whole module publish down with them. Ending
              # the accept thread is what lets this program finish.
              printf 'emit Config { port = 0 } to mod get _\nemit Listen { } to mod get l\nassert l.ok\nassert l.port > 0\nemit Stop { } to mod get s\nassert s.ok\n' >> dogfood/demo.code
              ;;
            http_client)
              # Nothing is listening on port 1, so this needs no network —
              # it proves the artifact loads and routes, and that a refused
              # connection comes back as a value rather than killing the
              # program (which is the whole contract of this module).
              printf 'emit Get { url = "http://127.0.0.1:1/" } to mod get r\nassert not r.ok\nassert r.status = 0\n' >> dogfood/demo.code
              ;;
            json)
              # Round-trips a value through JSON text and back — proof the
              # artifact loads, routes, and that Parse and Stringify agree.
              printf 'emit Stringify { value = { a = 1 } } to mod get s\nemit Parse { text = s.value } to mod get p\nassert p.value = { a = 1 }\n' >> dogfood/demo.code
              ;;
            crypto)
              # Cost 4 keeps this quick. Hash then verify — proof the artifact
              # loads, routes, and that the two agree on a real bcrypt string.
              printf 'emit Hash { password = "pw", cost = 4 } to mod get h\nemit Verify { password = "pw", hash = h.hash } to mod get v\nassert v.valid\n' >> dogfood/demo.code
              ;;
            jwt)
              # Configure a secret, sign, decode — proof the artifact loads, routes,
              # and that Sign and Decode agree on a real HS256 token.
              printf 'emit Config { secret = "k" } to mod get _\nemit Sign { sub = "u" } to mod get t\nemit Decode { token = t.token } to mod get d\nassert d.valid\nassert d.sub = "u"\n' >> dogfood/demo.code
              ;;
            markdown)
              # Render a heading — proof the artifact loads, routes, and that
              # the toc/title come back off a real parse.
              printf 'emit RenderMarkdown { src = "# Hi" } to mod get r\nassert r ∈ RenderedMarkdown\nassert r.title = "Hi"\nassert r.slug = "hi"\n' >> dogfood/demo.code
              ;;
            fs)
              # Configure a temp base, write and read a file back — proof the
              # artifact loads, routes, and that WriteFile/ReadFile agree.
              printf 'emit Config { base_path = "/tmp/code-dogfood-fs" } to mod get _\nemit WriteFile { path = "f", content = "hi" } to mod get w\nemit ReadFile { path = "f" } to mod get r\nassert r.content = "hi"\n' >> dogfood/demo.code
              ;;
            json_store)
              # Configure a temp base, store and fetch a value — proof the artifact
              # loads, routes, and that a value keeps its shape on disk.
              printf 'emit Config { base_dir = "/tmp/code-dogfood-jstore" } to mod get _\nemit Store { key = "k", value = { n = 1 } } to mod get w\nemit Fetch { key = "k" } to mod get f\nassert f.value = { n = 1 }\n' >> dogfood/demo.code
              ;;
            process)
              # Run a command and read its output back — proof the artifact
              # loads, routes, and captures stdout.
              printf 'emit Run { command = "echo", args = ["ok"] } to mod get r\nassert r.success\nassert r.stdout = "ok\\n"\n' >> dogfood/demo.code
              ;;
            git)
              # Config a fresh temp repo, init it, and read a clean status
              # back — proof the artifact loads, routes, and drives real git.
              printf 'emit Config { repo_path = "/tmp/code-dogfood-git" } to mod get _\nemit Init { } to mod get i\nassert i ∈ InitResult\nemit Status { } to mod get s\nassert s.clean\n' >> dogfood/demo.code
              ;;
            mailer)
              # Config a transport, then Send to a port nothing answers on:
              # proof the artifact loads, routes both particles, and that a
              # failed send comes back as a value rather than killing the
              # program.
              printf 'emit Config { host = "127.0.0.1", port = 1, from = "s@example.com", tls = "none" } to mod get c\nassert c.ok\nemit Send { recipient = "r@example.com", text = "x" } to mod get s\nassert s ∈ Exception\n' >> dogfood/demo.code
              ;;
            oauth)
              # Config a provider, build the auth URL (pure), then ExchangeCode
              # to a token endpoint nothing answers — proof both routing and
              # that a failed exchange is a value, not a crash.
              printf 'emit Config { client_id = "c", client_secret = "s", redirect_uri = "https://a/cb", auth_url = "https://a/auth", token_url = "http://127.0.0.1:1/t" } to mod get _\nemit AuthUrl { state = "x" } to mod get a\nassert a ∈ AuthUrlResult\nemit ExchangeCode { code = "z" } to mod get e\nassert e ∈ Exception\n' >> dogfood/demo.code
              ;;
            mongodb)
              # No MongoDB here — Config against a port nothing answers on,
              # with a short server-selection timeout. Proof the artifact
              # loads, routes, and that an unreachable database is a value.
              printf 'emit Config { url = "mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=500", database = "d" } to mod get c\nassert c ∈ Exception\n' >> dogfood/demo.code
              ;;
            blob_storage)
              # No object store here — Config succeeds (it just builds a
              # client), then any operation against a refused endpoint is an
              # Exception. Proof the artifact loads and routes.
              printf 'emit Config { bucket = "b", access_key = "k", secret_key = "s", endpoint = "http://127.0.0.1:1" } to mod get c\nassert c.ok\nemit Put { key = "k", data = "d" } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code
              ;;
            cloud_drive)
              # No Google here — Config succeeds, AuthUrl is pure (proof of
              # routing), and an operation against a refused endpoint is an
              # Exception.
              printf 'emit Config { client_id = "c", client_secret = "s", redirect_uri = "https://a/cb", token_url = "http://127.0.0.1:1/t", api_base = "http://127.0.0.1:1" } to mod get c\nassert c.ok\nemit AuthUrl { state = "x" } to mod get a\nassert a ∈ AuthUrlResult\nemit GetQuota { access_token = "t" } to mod get q\nassert q ∈ Exception\n' >> dogfood/demo.code
              ;;
            localai)
              # No model server here — Config succeeds, then a chat against a
              # refused endpoint is an Exception. Proof the artifact loads
              # and routes.
              printf 'emit Config { endpoint = "http://127.0.0.1:1" } to mod get c\nassert c.ok\nemit Chat { user = "hi" } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code
              ;;
            mailer_mock)
              printf 'emit Config { host = "mock", from = "me@x.test" } to mod get c\nassert c.ok\nemit Send { recipient = "you@x.test", subject = "hi", text = "yo" } to mod get s\nassert s.ok\nemit Outbox { } to mod get o\nassert o.count = 1\n' >> dogfood/demo.code
              ;;
            net_server)
              # Config, Listen, then Stop — binds an OS-chosen port on loopback
              # and never serves anything.
              #
              # `Stop` is not decoration. This module reports itself serving
              # while its accept thread is alive, and the host keeps a serving
              # program alive, so a demo that ended after `Listen` would not
              # end at all — it would sit here until the job timed out. That
              # is exactly how the http_server demo took two module publishes
              # down with it.
              printf 'emit Config { port = 0 } to mod get c\nassert c.ok\nemit Listen { } to mod get l\nassert l.ok\nassert l.port > 0\nemit Stop { } to mod get s\nassert s.ok\n' >> dogfood/demo.code
              ;;
            dom)
              # There is no page on a build machine, and that is what this
              # checks: the artifact loads, routes, and answers an Exception
              # rather than pretending to draw. The half that can draw is a
              # wasm archive, which this job does not build.
              printf 'emit Render { tree = { tag = "p" } } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code
              ;;
            guest)
              # `guest` runs one application inside another *in a page*, by
              # fetching a `.wasm` and giving it a container. A build machine
              # has neither, and the artifact says so rather than pretending
              # — on a machine a program hosts another by linking it, which
              # is `code_abi.h`'s hosting section and a different thing.
              printf 'emit Load { app = "x", url = "x.wasm" } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code
              ;;
            router|storage|timer)
              # Same as `dom`: no browser on a build machine, and the
              # artifact says so rather than pretending. The half that can do
              # the work is a wasm archive, which this job does not build.
              case "$m" in
                router)  printf 'emit Route { } to mod get r\nassert r ∈ Exception\nemit Where { } to mod get w\nassert w ∈ Exception\n' >> dogfood/demo.code ;;
                storage) printf 'emit Get { key = "k" } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code ;;
                timer)   printf 'emit Delay { ms = 1, then = "X" } to mod get r\nassert r ∈ Exception\n' >> dogfood/demo.code ;;
              esac
              ;;
            membrane)
              # No socket, no thread, nothing pushed — so unlike net_server
              # there is nothing here that could hold the demo open. Run on
              # its own it has no host, and `Listen` says so rather than
              # claiming a door it does not have.
              printf 'emit Config { port = 0 } to mod get c\nassert c.ok\nemit Listen { } to mod get l\nassert not l.ok\nemit Stop { } to mod get s\nassert s.ok\n' >> dogfood/demo.code
              ;;
            net_client)
              # Nothing is listening on port 1, so this needs no network — it
              # proves the artifact loads and routes, and that an unreachable
              # far side comes back as an Exception value rather than killing
              # the program.
              printf 'emit Send { url = "euglena://127.0.0.1:1/demo", particle = Ping { } } to mod get r\nassert r ∈ Exception\nassert r.source = "net_client"\n' >> dogfood/demo.code
              ;;
            oauth_mock)
              printf 'emit Config { client_id = "c", client_secret = "s", redirect_uri = "https://a/cb", auth_url = "https://a/auth", token_url = "https://a/tok" } to mod get c\nassert c.ok\nemit ExchangeCode { code = "abc" } to mod get i\nassert i ∈ Identity\nassert i.email = "abc@mock.test"\n' >> dogfood/demo.code
              ;;
            mongodb_mock)
              printf 'emit Config { url = "mock", database = "d" } to mod get c\nassert c.ok\nemit Store { key = "k", value = { n = 1 } } to mod get _\nemit Fetch { key = "k" } to mod get f\nassert f.value = { n = 1 }\n' >> dogfood/demo.code
              ;;
            blob_storage_mock)
              printf 'emit Config { bucket = "b", access_key = "k", secret_key = "s" } to mod get c\nassert c.ok\nemit Put { key = "x", data = "hi" } to mod get _\nemit Get { key = "x" } to mod get g\nassert g.found\nassert g.data = "hi"\n' >> dogfood/demo.code
              ;;
            cloud_drive_mock)
              printf 'emit Config { client_id = "c", client_secret = "s" } to mod get c\nassert c.ok\nemit ExchangeCode { code = "u" } to mod get t\nassert t ∈ Tokens\nemit UploadFile { access_token = "x", file_name = "f.txt", data = "hi" } to mod get f\nassert f ∈ RemoteFile\nemit DownloadFile { access_token = "x", file_id = f.file_id } to mod get d\nassert d.data = "hi"\n' >> dogfood/demo.code
              ;;
            git_mock)
              printf 'emit Config { repo_path = "/tmp/gitmock" } to mod get c\nassert c.ok\nemit Add { } to mod get _\nemit Commit { message = "m" } to mod get cm\nassert cm ∈ CommitResult\nemit Status { } to mod get s\nassert s.clean\n' >> dogfood/demo.code
              ;;
            localai_mock)
              printf 'emit Config { endpoint = "mock" } to mod get c\nassert c.ok\nemit Chat { user = "ping" } to mod get r\nassert r.content = "[mock mock-model] ping"\n' >> dogfood/demo.code
              ;;
            *) echo "::error::no dogfood demo for '$m' — add one when a module is added"; exit 1 ;;
          esac
          mv "dogfood/${m}-linux-x86_64.so" "dogfood/${m}.so"
          ./target/release/code run dogfood/demo.code
          ./target/release/code build dogfood/demo.code -o dogfood/demo
          CODE_CHECK_LEAKS=1 ./dogfood/demo

  # Attaches every module's artifact to the CLI's own release for this tag
  # (release.yml creates it from the same `v*` push). One release page, one
  # version, everything that version consists of.
  publish:
    name: Attach modules to the release
    needs:
      [
        resolve,
        build-linux-x86_64,
        build-wasm32,
        dogfood,
      ]
    runs-on: ubuntu-latest
    steps:
      # `pattern` rather than everything: since the `code` binary became an
      # artifact of its own (see build-code), an unfiltered download would
      # drop a 44MB compiler into dist/ — which `files: dist/*` below would
      # then try to attach to the release.
      - name: Download the module artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: module-*
      - name: Flatten into dist/
        run: find dist -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.a' \) -exec mv {} dist/ \;
      - name: Write one module.json per module
        run: |
          set -euo pipefail
          v="${{ needs.resolve.outputs.version }}"
          sum() { sha256sum "dist/$1" | cut -d' ' -f1; }
          for m in console strings math env http_client http_server json crypto jwt markdown fs json_store process git mailer oauth mongodb blob_storage cloud_drive localai blob_storage_mock cloud_drive_mock git_mock localai_mock mailer_mock mongodb_mock net_client net_server membrane dom guest router storage timer oauth_mock; do
            # Handlers live with their module — keep this in sync when a
            # module gains one (the index consumers show it in docs/help).
            case "$m" in
              console) handlers='["Print"]' ;;
              strings) handlers='["Shout", "Echo", "Split", "Join", "Trim", "Upper", "Lower"]' ;;
              math) handlers='["Double", "Sum"]' ;;
            env) handlers='["Get", "Require"]' ;;
              http_client) handlers='["Get", "Post", "Put", "Patch", "Delete", "Head", "Options"]' ;;
              http_server) handlers='["Config", "Listen"]' ;;
              json) handlers='["Parse", "Stringify"]' ;;
              crypto) handlers='["Hash", "Verify", "RandomCode"]' ;;
              jwt) handlers='["Config", "Sign", "Decode"]' ;;
              markdown) handlers='["RenderMarkdown", "SplitByHeading"]' ;;
              fs) handlers='["Config", "ReadFile", "WriteFile", "DeleteFile", "CreateDir", "RemoveDir", "ListDir", "Exists"]' ;;
              json_store) handlers='["Config", "Store", "Fetch", "Delete", "Remove"]' ;;
              process) handlers='["Run", "Spawn", "Status", "Wait", "WaitFor", "Kill", "List"]' ;;
              git) handlers='["Config", "Stash", "StashPop", "Init", "Clone", "Add", "Commit", "Push", "SetRemote", "Status"]' ;;
              mailer) handlers='["Config", "Send"]' ;;
              oauth) handlers='["Config", "AuthUrl", "BuildAuthUrl", "ExchangeCode"]' ;;
              mongodb) handlers='["Config", "Store", "Fetch", "Delete", "Insert", "InsertMany", "Find", "Count", "Drop"]' ;;
              blob_storage) handlers='["Config", "Put", "Upload", "Get", "Download", "Delete", "List"]' ;;
              cloud_drive) handlers='["Config", "AuthUrl", "BuildAuthUrl", "ExchangeCode", "RefreshToken", "GetQuota", "ListFiles", "UploadFile", "DownloadFile", "DeleteFile"]' ;;
              localai) handlers='["Config", "Chat", "ChatJson", "Transcribe", "TranscribeWithOptions"]' ;;
              mailer_mock) handlers='["Config", "Send", "Outbox"]' ;;
              net_server) handlers='["Config", "Listen", "Stop"]' ;;
            membrane) handlers='["Config", "Listen", "Stop"]' ;;
              dom) handlers='["Render"]' ;;
              guest) handlers='["Load", "Unload", "Tell"]' ;;
              router) handlers='["Route", "Navigate", "Watch", "Where"]' ;;
              storage) handlers='["Get", "Set", "Remove"]' ;;
              timer) handlers='["Delay", "Cancel"]' ;;
              net_client) handlers='["Send"]' ;;
              oauth_mock) handlers='["Config", "AuthUrl", "BuildAuthUrl", "ExchangeCode"]' ;;
              mongodb_mock) handlers='["Config", "Store", "Fetch", "Delete", "Insert", "InsertMany", "Find", "Count", "Drop"]' ;;
              blob_storage_mock) handlers='["Config", "Put", "Upload", "Get", "Download", "Delete", "List"]' ;;
              cloud_drive_mock) handlers='["Config", "AuthUrl", "BuildAuthUrl", "ExchangeCode", "RefreshToken", "GetQuota", "ListFiles", "UploadFile", "DownloadFile", "DeleteFile"]' ;;
              git_mock) handlers='["Config", "Stash", "StashPop", "Init", "Clone", "Add", "Commit", "Push", "SetRemote", "Status"]' ;;
              localai_mock) handlers='["Config", "Chat", "ChatJson", "Transcribe", "TranscribeWithOptions"]' ;;
              # `set -u` would fail on the unbound variable below anyway; this
              # says *why* instead of pointing at the heredoc.
              *) echo "::error::no handler list for '$m' — add one here when a module is added"; exit 1 ;;
            esac
            # `setup`: the handler a stateful module must be sent first. A
            # consumer (euglena) reads it to know what a manifest's config
            # block should emit. Stateless modules have none.
            case "$m" in
              http_server) setup='"setup": "Config",' ;;
              net_server) setup='"setup": "Config",' ;;
            membrane) setup='"setup": "Config",' ;;
              jwt|fs|json_store|git|mailer|oauth|mongodb|blob_storage|cloud_drive|localai|*_mock) setup='"setup": "Config",' ;;
              *) setup='' ;;
            esac
            # The browser archive, for the few modules that have one. Absent
            # rather than empty for the rest: a platform key that exists is a
            # promise the bytes are there, and `code install --platform` says
            # what a release does offer when asked for one it does not.
            wasm32=''
            if [ -f "dist/${m}-wasm32.a" ]; then
              wasm32=",
              \"wasm32\": { \"asset\": \"${m}-wasm32.a\", \"sha256\": \"$(sum ${m}-wasm32.a)\" }"
            fi
            cat > "dist/${m}.json" <<EOF
          {
            "name": "${m}",
            "version": "${v}",
            "abi_version": 1,
            "handlers": ${handlers},
            "vars": [],
            ${setup}
            "platforms": {
              "linux-x86_64": { "asset": "${m}-linux-x86_64.so", "sha256": "$(sum ${m}-linux-x86_64.so)" }${wasm32}
            }
          }
          EOF
            python3 -m json.tool "dist/${m}.json" >/dev/null # validate
          done
      - name: Upload build artifacts (always — usable as a dry-run record)
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ needs.resolve.outputs.version }}
          path: dist/*
      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
