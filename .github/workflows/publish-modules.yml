name: Publish modules

on:
  # Per-module versioning: `modules/terminal/v1.0.0` cuts a release for
  # `terminal` at 1.0.0 without touching anything else. Each first-party
  # module ships on its own cadence (docs/todo/community-modules.md).
  push:
    tags: ["modules/*/v*"]
  # Manual dry-run: builds every platform artifact and uploads them as
  # Actions artifacts, but creates no GitHub Release (guarded below), so
  # the pipeline can be exercised without cutting a tag.
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve module + version
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # modules/<name>/v<semver> -> name, semver
            ref="${GITHUB_REF_NAME}"
            module="$(cut -d/ -f2 <<<"$ref")"
            version="${ref##*/}"
            version="${version#v}"
          else
            module="terminal"
            version="dev-${GITHUB_SHA}"
          fi
          # Allowlist: only modules whose source lives under crates/modules/.
          # Add a line here when math/net land.
          case "$module" in
            terminal|strings) ;;
            *) echo "::error::unknown module '$module' (allowed: terminal, strings)"; exit 1 ;;
          esac
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Every build job compiles the same way — one self-contained crate, no
  # external dependencies — so the only differences are the runner, the
  # compiler invocation, and the artifact extension (.so vs .dylib).
  # `terminal` is plain C (`cc`); `strings` is Rust on `code-native`
  # (`cargo build` inside its standalone workspace — see that crate's
  # Cargo.toml for why it opts out of the main one). Asset names follow the
  # distribution doc: <module>-<platform><ext>.
  build-linux-x86_64:
    name: Build linux-x86_64
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          set -euo pipefail
          m="${{ needs.resolve.outputs.module }}"
          mkdir -p dist
          case "$m" in
            strings)
              (cd "crates/modules/$m" && cargo build --release)
              mv "crates/modules/$m/target/release/lib$m.so" "dist/${m}-linux-x86_64.so"
              ;;
            *)
              cc -O2 -shared -fPIC \
                -o "dist/${m}-linux-x86_64.so" \
                "crates/modules/${m}/${m}.c" -lm -ldl
              ;;
          esac
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ needs.resolve.outputs.module }}-linux-x86_64
          path: "dist/*.so"

  # Proof the artifact actually loads: build the real `code` binary and run
  # a script that links the just-built .so through BOTH output modes — the
  # same parity invariant the fixture harness enforces, applied to the
  # shipped artifact rather than the test-tree build.
  dogfood:
    name: Dogfood (load artifact via code run + code build)
    needs: [resolve, build-linux-x86_64]
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build code
        run: cargo build --release
      - name: Download linux-x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: module-${{ needs.resolve.outputs.module }}-linux-x86_64
          path: dogfood
      - name: Run through both output modes
        run: |
          set -euo pipefail
          m="${{ needs.resolve.outputs.module }}"
          # One small dispatch per module — proof the artifact loads and
          # routes a particle, in both output modes. `Print` writes to
          # stdout and reports 13; `Echo` hands its operand back unchanged,
          # so asserting on the echoed value proves the round trip.
          cat > dogfood/demo.code <<EOF
          link "${m}.so" as mod
          EOF
          case "$m" in
            terminal)
              printf 'emit Print { "value": "phase B works" } to mod get r\nassert r.value = 13\n' >> dogfood/demo.code
              ;;
            strings)
              printf 'emit Echo { "value": 13 } to mod get r\nassert r.value = 13\n' >> dogfood/demo.code
              ;;
          esac
          mv "dogfood/${m}-linux-x86_64.so" "dogfood/${m}.so"
          ./target/release/code run dogfood/demo.code
          ./target/release/code build dogfood/demo.code -o dogfood/demo
          CODE_CHECK_LEAKS=1 ./dogfood/demo

  publish:
    name: Create GitHub Release
    needs:
      [
        resolve,
        build-linux-x86_64,
        dogfood,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten into dist/
        run: find dist -type f \( -name '*.so' -o -name '*.dylib' \) -exec mv {} dist/ \;
      - name: Write module.json
        run: |
          set -euo pipefail
          m="${{ needs.resolve.outputs.module }}"
          v="${{ needs.resolve.outputs.version }}"
          sum() { sha256sum "dist/$1" | cut -d' ' -f1; }
          # Handlers live with their module — keep this in sync when a
          # module gains one (the index consumers show it in docs/help).
          case "$m" in
            terminal) handlers='["Print"]' ;;
            strings) handlers='["Shout", "Echo", "Split", "Join", "Trim", "Upper", "Lower"]' ;;
          esac
          cat > "dist/${m}.json" <<EOF
          {
            "name": "${m}",
            "version": "${v}",
            "abi_version": 1,
            "handlers": ${handlers},
            "vars": [],
            "platforms": {
              "linux-x86_64": { "asset": "${m}-linux-x86_64.so", "sha256": "$(sum ${m}-linux-x86_64.so)" }
            }
          }
          EOF
          python3 -m json.tool "dist/${m}.json" >/dev/null # validate
      - name: Upload build artifacts (always — usable as a dry-run record)
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ needs.resolve.outputs.module }}-${{ needs.resolve.outputs.version }}
          path: dist/*
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
