name: Publish crates.io (code-native)

# Publishes code-native via crates.io Trusted Publishing (OIDC) — no
# CARGO_REGISTRY_TOKEN stored anywhere, same reasoning as
# publish-npm-wasm.yml's npm Trusted Publishing setup. Requires the trusted
# publisher to already be configured on crates.io's side for this exact
# repo + workflow filename (crates.io → package settings → Trusted
# Publishing) — see crates/code-native/README.md's "Releasing" section.
#
# Trigger: the repository's own `v*` release tag. Everything published from
# here shares one version (2026-08-29, reversing the per-artifact cadence this
# used to have) so a user never has to ask whether their `code` and their
# `code-native` match — see tests/one_version.rs.
# `workflow_dispatch` is a dry run: builds and verifies the exact package
# that *would* be published, but the publish step itself is gated to real
# tags only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for crates.io Trusted Publishing

jobs:
  publish:
    name: Build, verify, and publish code-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: github.ref_type == 'tag'

      # On a real release tag, set Cargo.toml's version from the tag itself
      # (`v1.1.0` -> `1.1.0`) rather than trusting it was hand-bumped
      # beforehand — one source of truth for what's published.
      - name: Set crate version from tag
        if: github.ref_type == 'tag'
        working-directory: crates/code-native
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      # Proves the crate is actually self-contained — builds in an isolated
      # copy of only what `cargo package` would ship, the same guarantee
      # tests/native_crate_vendor_sync.rs exists to protect (see that file).
      - name: Verify the packaged crate builds standalone
        working-directory: crates/code-native
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: github.ref_type == 'tag'
        working-directory: crates/code-native
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
