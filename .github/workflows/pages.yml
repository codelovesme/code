name: Deploy playground

# Dogfoods the published npm package rather than building code-wasm from
# source: the same artifact a real `npm install code-wasm` embedder gets is
# what the playground runs, so a packaging bug (missing file, wrong export)
# would show up here too, not just in crates/code-wasm/npm/'s own
# smoke-test.mjs. This is also why `src/**`/`crates/code-wasm/**` are no
# longer in the trigger path list below — a Rust source change has no effect
# on the playground until PLAYGROUND_CODE_WASM_VERSION is bumped by hand and
# a real npm release ships (see .github/workflows/publish-npm-wasm.yml and
# crates/code-wasm/npm/README.md's "Releasing" section).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/*.code"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

env:
  # Bump this and push after every real `code-wasm` npm release you want the
  # playground to pick up — it does not track `latest` automatically, the
  # same deliberate pinning the old language's playground used.
  PLAYGROUND_CODE_WASM_VERSION: "1.1.3"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installed into a scratch directory, well outside the repo checkout,
      # so nothing from `npm install` (a node_modules tree, a lockfile) ever
      # risks being picked up by anything else in this job.
      # Retried, because the release that publishes a version and the commit
      # that pins it arrive together: pushing `main` and its `v*` tag fires
      # this workflow and the npm publish at the same moment, and npm takes a
      # couple of minutes. Failing instantly there is what happened on
      # 2026-08-30 — the deploy was red for a version that existed three
      # minutes later.
      - name: Fetch code-wasm@${{ env.PLAYGROUND_CODE_WASM_VERSION }} from npm
        run: |
          set -euo pipefail
          mkdir -p /tmp/code-wasm-pkg
          cd /tmp/code-wasm-pkg
          for attempt in 1 2 3 4 5 6; do
            if npm install --no-save "code-wasm@${PLAYGROUND_CODE_WASM_VERSION}"; then
              exit 0
            fi
            echo "code-wasm@${PLAYGROUND_CODE_WASM_VERSION} is not on npm yet (attempt $attempt/6)"
            sleep 30
          done
          echo "::error::code-wasm@${PLAYGROUND_CODE_WASM_VERSION} never appeared on npm. \
          PLAYGROUND_CODE_WASM_VERSION must name a release that is published — tag it first, \
          or point the pin at a version that exists."
          exit 1

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/pkg
          cp /tmp/code-wasm-pkg/node_modules/code-wasm/dist/* dist/pkg/
          python3 site/build.py . dist

      # The examples come from this checkout and the engine comes from npm,
      # which is exactly how the page ended up offering programs its own
      # engine could not parse. Nothing connected the two until this step.
      - name: Every example runs in the pinned engine
        run: node site/check_examples.mjs dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
