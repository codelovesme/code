name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/code-wasm/**"
      - "src/**"
      - "tests/*.code"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Interpreter only — code-wasm depends on the root crate with
      # default-features = false (see crates/code-wasm/Cargo.toml), so this
      # never touches the llvm feature/inkwell at all (wasm32-unknown-unknown
      # has no native LLVM toolchain to link against anyway).
      - name: Build code-wasm for wasm32-unknown-unknown
        run: cargo build -p code-wasm --release --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli matching the wasm-bindgen crate version
        run: |
          set -euo pipefail
          version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/pkg
          wasm-bindgen --target web --out-dir dist/pkg \
            target/wasm32-unknown-unknown/release/code_wasm.wasm
          python3 site/build.py . dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
