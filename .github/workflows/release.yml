name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry-run: builds and uploads an Actions artifact but does not create
  # a GitHub Release (see the `if: github.ref_type == 'tag'` guards below), so
  # the packaging can be exercised without cutting a real tag.
  workflow_dispatch: {}

env:
  # inkwell links LLVM 17 (codegen.rs). Same setup as ci.yml.
  LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build release tarball (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev libpolly-17-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Single source of truth for the shipped version is the git tag, so the
      # binary's `--version` matches the release rather than trusting a
      # hand-edited Cargo.toml. v0.1.0 -> 0.1.0.
      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v="${{ github.ref_name }}"
          v="${v#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Determine version string
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package tarball
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          stage="code-${v}-x86_64-linux"
          mkdir -p "$stage"
          cp target/release/code "$stage/code"
          cp LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          ls -1 ./*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-release-${{ steps.version.outputs.version }}
          path: "*.tar.gz"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
