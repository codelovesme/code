name: Publish VSIX (editor extension)

# Builds the Code language's official VS Code editor integration from this
# commit and ships it as a .vsix alongside the release tarball.
#
# Like release.yml, it triggers on the repository's own `v*` tag, because
# everything published from here shares one version (see tests/one_version.rs,
# which also checks this extension's package.json) — `workflow_dispatch` is a
# dry run that proves the packaging without creating any artifact anywhere.
#
# This workflow deliberately creates NO marketplace account and stores NO
# token. Both marketplaces offer trusted/OIDC-style flows, but neither has
# settled on that being the right door for this project yet (this was decided
# against, on purpose, after checking what each actually offers); see
# docs/todo/editor-vscode-publication.md for the recorded choice and the
# follow-up that would flip it. Until then the .vsix lands where it does: an
# Actions artifact plus a file attached to the very same GitHub Release that
# release.yml creates for `code` itself — so "download the matching .vsix
# next to the code tarball of your version" always works, on every platform,
# with credentials already present on this repository and nothing new to set
# up.
#
# Building `code-lsp` twice (linux-x64 natively, darwin-arm64 cross-compiled)
# never touches LLVM: crates/code-lsp turns off the `llvm` feature, and a
# pure-Rust cross compile needs no C linker and no macOS runner — unlike
# release.yml's full CLI, which is why that one still installs LLVM 17.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # The final step (attach to the shared GitHub Release) relies on
  # softprops/action-gh-release behaving additively toward an ALREADY-
  # EXISTING release object: it adds the listed files to the existing
  # asset set without resetting/release-replacing the notes, metadata, or
  # assets release.yml itself contributed for this same tag. That merge
  # semantics is the reason attaching here is safe even if this job and
# release.yml's finish in either order.
  contents: write

jobs:
  pack:
    name: Build code-lsp, verify the package, ship the VSIX
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # x86_64 (host), plus the one cross target below. No `components`:
          # `cargo test --test one_version` is pure std and cargo fmt/clippy
          # intentionally stay ci.yml's job, not a parallel gate everywhere.
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The tag is the source of truth (mirror of release.yml /
      # publish-crates-native.yml): derive a semver-compatible version string
      # for the untagged dry-run case too, since vsce needs something real to
      # put in the manifest. 999.0.dev-<short-sha> sorts above any real
      # release, so it could never be mistaken for one, and it identifies the
      # exact commit the dry run actually exercised — the point of the dry
      # run, versus a fixed synthetic marker.
      - id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="999.0.dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Stamping mirrors release.yml and publish-crates-native.yml verbatim:
      # on a real tag, rewrite the two manifests this workflow owns out-of-the-box
      # (the extension's package.json and code-lsp's Cargo.toml — the very inputs
      # the next step bakes into the .vsix) so that the shipped identity comes
      # from the tag itself, not from whatever happened to be in the tree at
      # tag-time. Untagged dry-runs skip this and keep whatever already sits in
      # the tree (tests/one_version.rs guarantees mutual agreement whenever it
      # ran last green) purely to validate the mechanics.
      - name: Stamp package versions from tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" editor/vscode/package.json
          (cd crates/code-lsp && sed -i "0,/^version = \"[^\"]*\"/{s//version = \"$v\"/}" Cargo.toml)
          grep -m1 '"version"' editor/vscode/package.json
          grep -m1 '^version = ' crates/code-lsp/Cargo.toml

      # Build both bundled server binaries on this single runner: linux-x64
      # natively, darwin-arm64 cross-compiled with rustc alone. code-lsp
      # opts out of the default features (see its Cargo.toml), so there is
      # no C linker dependency and macOS hardware is unnecessary. By
      # contrast, release.yml needs apt-installed LLVM because of the
      # full CLI.
      - name: Build the bundled code-lsp (both platforms)
        run: |
          set -euo pipefail
          mkdir -p editor/vscode/server/linux-x64 editor/vscode/server/darwin-arm64
          cargo build --release --bin code-lsp
          install -m 0755 target/release/code-lsp editor/vscode/server/linux-x64/code-lsp
          cargo build --release --bin code-lsp --target aarch64-apple-darwin
          install -m 0755 target/aarch64-apple-darwin/release/code-lsp editor/vscode/server/darwin-arm64/code-lsp

      # Locked (npm ci, honoring package-lock.json), so a fresh CI box resolves
      # the identical node_modules graph a developer builds locally. Type errors
      # surface here (compile), before packing hides them inside an otherwise
      # well-formed archive.
      - name: Install Node deps and compile TypeScript
        working-directory: editor/vscode
        run: |
          set -euo pipefail
          npm ci
          npm run compile

      # Clear any stale hand-packed VSIX left in the folder by prior local iteration
      # (they'd otherwise coexist with, and obscure verification of, the freshly produced one),
      # then call the project-pinned packager (declared in package.json's devDependencies),
      # which automatically re-runs that `vscode:prepublish` hook internally anyway.
      - name: Package VSIX
        working-directory: editor/vscode
        run: |
          set -euo pipefail
          rm -f ./*.vsix
          npx @vscode/vsce package
          ls -1 ./*.vsix

      # Don't trust the packer's exit code alone. A past incident shipped a VSIX whose runtime dependency closure quietly went missing, silently breaking first-activation until someone opened a new profile. Unpack it and structurally require that the expected production-set member list (editor/Vscode ignore's negation whitelist) AND the two platform binaries are present, while dev-only siblings are absent — this promotes this invariant from reliance-on-memory to enforcement-by-CI.
      - name: Verify packed VSIX matches minimal production closure
        working-directory: editor/vscode
        run: |
          set -euo pipefail
          vsix="$(ls -1 ./*.vsix)"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -q "$vsix" -d "$tmpdir/unpacked"
          ext="$tmpdir/unpacked/extension"
          for want in \
              package.json \
              out/extension.js \
              server/linux-x64/code-lsp \
              server/darwin-arm64/code-lsp \
              node_modules/vscode-languageclient/package.json \
              node_modules/vscode-languageserver-protocol/package.json \
              node_modules/vscode-jsonrpc/package.json \
              node_modules/minimatch/package.json \
              node_modules/semver/package.json \
              node_modules/brace-expansion/package.json \
              node_modules/balanced-match/package.json
          do
            if [[ ! -e "$ext/$want" ]]; then
              echo "FAIL: required entry missing from packaged VSIX: $want" >&2
              exit 1
            fi
          done
          if [[ -e "$ext/node_modules/typescript" || -e "$ext/node_modules/@types" || -e "$ext/node_modules/esbuild" ]]; then
            echo "FAIL: development-only dependency leaked into the packaged node_modules/" >&2
            exit 1
          fi
          echo "OK: packaged VSIX satisfies the expected minimal production closure ($(du -h "$vsix" | cut -f1))"

      # Ship shape recorded in docs/todo/editor-vscode-publication.md:
      #   - artifact upload ALWAYS (dry-run included, mirrors release.yml);
      #   - attachment to the SHARED GitHub Release only on a real tag —
      #     softprops/action-gh-release merges additively onto the already
      #     existing release object release.yml created for this tag (adds
      #     assets, resets neither notes nor the other artifacts), so order /
      #     whichever-workflow-calls-ghr-does-not-matter race-safe.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-editor-vsix-${{ steps.version.outputs.version }}
          path: editor/vscode/*.vsix

      # Attaching an asset to the existing release object (not creating a
      # second one): release.yml owns creation and any metadata it writes;
      # this step only APPENDS the .vsix, so either order of completion across
      # the two workflows cannot clobber notes or delete each other's files.
      - name: Attach the .vsix to the shared GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            editor/vscode/*.vsix
