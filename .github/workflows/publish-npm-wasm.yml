name: Publish npm (code-wasm)

# Publishes code-wasm via npm Trusted Publishing (OIDC) — no
# NPM_TOKEN stored anywhere. npm exchanges this workflow's short-lived GitHub
# OIDC token for a short-lived publish credential at publish time; nothing
# long-lived to leak, nothing to rotate. Requires the trusted publisher to
# already be configured on npm's side for this exact repo + workflow
# filename (npmjs.com → package settings → Trusted Publisher → GitHub
# Actions) — see crates/code-wasm/npm/README.md's "Releasing" section.
#
# Trigger: the repository's own `v*` release tag. Everything published from
# here shares one version (2026-08-29, reversing the per-artifact cadence this
# used to have) so a user never has to ask whether their `code` and the npm
# package match — see tests/one_version.rs. `workflow_dispatch` is a dry run:
# builds and smoke-
# tests the exact package that *would* be published, but the publish step
# itself is gated to real tags only (mirrors release.yml's dry-run pattern).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing

jobs:
  publish:
    name: Build, smoke-test, and publish code-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Trusted Publishing needs npm CLI 11.5.1+ and Node 22.14.0+. Node 24
      # (not just the documented 22.14 floor) because npm's own engine
      # requirement has already moved past what 22.14.0 satisfies once —
      # `npm@latest` drifted to a major version needing Node ^22.22.2 or
      # ^24.15.0, breaking a run pinned to the bare minimum. Pin npm to
      # major 11 (still gets 11.x patches) instead of `@latest`, so a
      # future npm major bump can't silently break this again the same way.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure npm CLI is new enough for Trusted Publishing
        run: npm install -g npm@11

      - name: Build the npm package artifact
        run: bash crates/code-wasm/npm/build.sh

      # On a real release tag, set package.json's version from the tag
      # itself (`v1.1.0` → `1.1.0`) rather than trusting it was
      # hand-bumped and committed correctly beforehand — one source of
      # truth for what's about to be published.
      - name: Set package version from tag
        if: github.ref_type == 'tag'
        working-directory: crates/code-wasm/npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      # Same verification as crates/code-wasm/npm/README.md's "Releasing"
      # section recommends doing locally before a manual publish — run it
      # here too so a workflow_dispatch dry run actually proves something.
      - name: Verify the packaged artifact
        working-directory: crates/code-wasm/npm
        run: |
          npm pack --dry-run
          node smoke-test.mjs

      # Re-running a tag's pipeline must be a normal thing to do — the VSIX
      # job failing on its own is reason enough, and it should not mean
      # collecting a red X here for work that already succeeded. npm is
      # immutable, so republishing a version is a 403 rather than a no-op;
      # asking the registry first turns "already done" into what it is.
      - name: Is this version already on npm?
        id: published
        if: github.ref_type == 'tag'
        working-directory: crates/code-wasm/npm
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          if npm view "code-wasm@$v" version >/dev/null 2>&1; then
            echo "code-wasm $v is already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: github.ref_type == 'tag' && steps.published.outputs.skip != 'true'
        working-directory: crates/code-wasm/npm
        run: npm publish --provenance
