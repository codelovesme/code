[workspace]
members = ["crates/code-native", "crates/code-lsp"]

[package]
name = "code"
version = "0.2.0"
edition = "2021"
description = "The Code programming language — interpreter and LLVM compiler"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/codelovesme/code"

[lib]
name = "code_lang"
path = "src/lib.rs"

[[bin]]
name = "code"
path = "src/main.rs"

[dependencies]
chumsky = "0.9"
anyhow = "1"
inkwell = { version = "0.4", features = ["llvm17-0"] }
libloading = "0.8"
wasmi = "1.0"
