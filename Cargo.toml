[workspace]
members = [".", "crates/code-wasm", "crates/code-native", "crates/code-lsp"]

[package]
name = "code"
version = "2.3.0"
edition = "2021"
description = "The Code programming language — interpreter and compiler (rewrite; see old/ for the previous version kept as architectural reference)."
license = "GPL-3.0"

[lib]
name = "code"
path = "src/lib.rs"

[[bin]]
name = "code"
path = "src/main.rs"

[features]
default = ["llvm", "native-modules", "install"]
# The LLVM backend (codegen.rs, `code build`). Off for targets with no native
# LLVM toolchain — currently just wasm32-unknown-unknown (crates/code-wasm),
# which only ever needs the interpreter.
llvm = ["dep:inkwell"]
# `link`ing a native `.so` module (src/native.rs), via dlopen/dlsym — off for
# the same reason `llvm` is: wasm32-unknown-unknown has no dlopen, and
# code-wasm's `NoModules` resolver refuses every `link` anyway, so there is
# nothing for this feature to do there.
native-modules = ["dep:libloading", "dep:libc"]
# `code install` / `remove` / `ls` (src/module_install.rs): downloads module
# artifacts over HTTPS (via curl) and pins them in a project lockfile. Off
# for wasm32-unknown-unknown — the browser host has no filesystem story at
# all (`NoModules`) and must not carry serde in the bundle.
install = ["dep:serde", "dep:serde_json"]

[dependencies]
inkwell = { version = "0.4", features = ["llvm17-0"], optional = true }
libloading = { version = "0.8", optional = true }
# Only for `memfd_create`: an organelle is loaded from its own in-memory
# image so that linking one file twice gives two organelles rather than two
# names for one (see `native.rs`'s `module_image`). Already in the tree via
# `libloading`, so this declares a dependency rather than adding one.
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Test-only, and for exactly one test: `tests/azure_mailer_module.rs`
# recomputes Azure's HMAC-SHA256 request signature from the same key the
# fixture configures, and compares it with the one the module sent. A wrong
# signature is not a crash and not a wrong-looking request — it is a 401
# from a real service, months later, with nothing local to reproduce it. The
# module itself carries these in its own standalone workspace; this is the
# test's independent second opinion, which is only worth having if it does
# not share the module's code.
[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

# wasm only, and only for the clock: `SystemTime::now()` panics on
# wasm32-unknown-unknown, so `emit Timestamp to core` needs the browser's
# `Date.now()` (see `interpreter::unix_seconds`). A native build never sees
# this dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
